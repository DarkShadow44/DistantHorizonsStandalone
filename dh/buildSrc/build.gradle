plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
    maven { url = 'https://maven.wagyourtail.xyz/releases' } // unimined libs
    maven { url = 'https://maven.outlands.top/releases' } // Hosts the kappa fork of unimined
    maven { url = 'https://maven.wagyourtail.xyz/snapshots' } // The manifold gradle plugin we use
    maven { url = 'https://maven.architectury.dev/' } // Minecraft mod libs
    maven { url = 'https://maven.fabricmc.net/' } // Fabric
    maven { url = 'https://maven.neoforged.net/releases/' } // NeoForge
    maven { url = 'https://maven.minecraftforge.net/' } // Forge
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } // Hosts minecraft libs
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' } // Hosts a few dependencies we use
}

dependencies {
	// Updating past shadow 9.0.0 causes Fabric and Neoforge to compile to different binaries, 
	// causing Forgix to merge the files separately, 
	// breaking Neoforge's translation files.
	// Note: this only seems to happen for MC versions between 1.21.1 and 1.21.11 (inclusive)
	// this is probably due to how Unimined handles compiling, so additional checks
	// may need to be done when updating Unimined.
    implementation 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'
	
    implementation 'xyz.wagyourtail.unimined:xyz.wagyourtail.unimined.gradle.plugin:1.4.41-kappa'
    implementation 'xyz.wagyourtail:manifold-gradle:1.0.0-SNAPSHOT'
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-tree:9.6'
    implementation 'xyz.wagyourtail.jvmdowngrader:xyz.wagyourtail.jvmdowngrader.gradle.plugin:1.3.6'
}
