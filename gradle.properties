# The wrapper builds nothing itself; these settings are for the DH build it drives.
org.gradle.jvmargs = -Xmx4096M
org.gradle.parallel = true
org.gradle.caching = true

# ---------------------------------------------------------------------------
# GTNHGradle configuration.
#
# The wrapper applies `com.gtnewhorizons.gtnhgradle` (the modular plugin), not
# `gtnhconvention` (which turns every module on). Only the two modules that make
# sense for a repo with no sources are switched on and applied in build.gradle:
# GitVersionModule (git-tag versioning) and PublishingModule (Maven/Modrinth/CF).
# Everything else -- toolchain, mixins, spotless, structure checks, the updater --
# would want to own sources, mappings and formatting that live in dh/ and are
# built by unimined instead.
# ---------------------------------------------------------------------------
gtnh.modules.gitVersion = true
gtnh.modules.publishing = true

gtnh.modules.toolchain = false
gtnh.modules.codeStyle = false
gtnh.modules.scala = false
gtnh.modules.structureCheck = false
gtnh.modules.accessTransformers = false
gtnh.modules.mixin = false
gtnh.modules.standardScripts = false
gtnh.modules.oldGradleEmulation = false
gtnh.modules.modernJava = false
gtnh.modules.ideIntegration = false
gtnh.modules.utility = false
gtnh.modules.updater = false

# No blowdryer: the shared GTNH spotless/checkstyle config has nothing to format here,
# and dh/ is upstream code that must not be reformatted.
gtnh.settings.blowdryerTag =

# Required by GTNHGradle's property validation. Mirrors dh/gradle.properties.
modName = DistantHorizons
modId = distanthorizons
modGroup = com.seibel.distanthorizons

usesMavenPublishing = true
# DH's version scheme ("3.2.1-b-dev") is not GTNH's, and our tags are the wrapper's.
versionPattern =
minecraftVersion = 1.7.10
