// GTNH Distant Horizons wrapper.
//
// The real build lives in dh/ and is imported unmodified as a composite build.
// dh/coreSubProjects is a subtree, so DH's own build finds core exactly where
// it expects it -- no `git submodule` step, no build script patching.

pluginManagement {
    repositories {
        maven {
            name = 'GTNH Maven'
            url = uri('https://nexus.gtnewhorizons.com/repository/public/')
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'gtnh-dh'

// DH selects its Minecraft target from -PmcVer and defaults to a modern version.
// This wrapper only ever ships the GTNH target, so pin it unless asked otherwise.
// It has to go on the start parameter: that is what included builds inherit, and
// Settings' own copy of it is read-only, so mutate the one on `gradle`.
// The client run directory is pinned the same way, so DH's runClient keeps using
// this wrapper's run/ (worlds, config, logs) instead of dh/run/client.
def projectProps = new HashMap<String, String>(gradle.startParameter.projectProperties)
projectProps.putIfAbsent('mcVer', '1.7.10')
projectProps.putIfAbsent('dhClientRunDir', new File(settingsDir, 'run').absolutePath)
gradle.startParameter.setProjectProperties(projectProps)

includeBuild('dh')
